<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2c2c32" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>PaidLoop</title>
    <script>
      // Set theme and density before the first paint, so the page never flashes the wrong look.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("paidloop.theme") || "auto";
          var dark = theme === "dark" || (theme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.setAttribute("data-density", localStorage.getItem("paidloop.density") === "compact" ? "compact" : "comfortable");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
